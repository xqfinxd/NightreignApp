<!doctype html>
<html lang="zh-cn">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Nightreign App</title>
  <link rel="shortcut icon" href="/nightreign/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/nightreign/css/style.css">
  <style>
    /* 简化的加载状态显示 */
    #loading-status {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 9999;
      backdrop-filter: blur(5px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: opacity 0.3s ease-out;
      max-width: 90%;
      text-align: center;
    }

    #loading-status.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- 简化的加载状态 -->
  <div id="loading-status">Initializing...</div>

  <!-- B1 Overlay 控制按钮 -->
  <button id="btn-b1-overlay" class="top-right-btn" type="button" title="切换 B1 Overlay">
    地下
  </button>

  <!-- 可折叠信息框 -->
  <div class="info-panel-container">
    <button id="btn-toggle-info" class="info-toggle-btn" type="button" title="展开/折叠信息">
      情报
    </button>
    <div id="info-panel" class="info-panel collapsed">
      <div class="info-panel-content"></div>
    </div>
  </div>

  <!-- 游戏界面 -->
  <div class="fab-container">
    <!-- 地图按钮组 -->
    <div class="fab-group-wrapper fab-map-group">
      <div class="fab-group js-toggle-group-map collapsed" role="toolbar" aria-label="地图选择">
        <button class="btn" type="button" data-value="0">普&emsp;通</button>
        <button class="btn" type="button" data-value="1">雪&emsp;山</button>
        <button class="btn" type="button" data-value="2">火&emsp;山</button>
        <button class="btn" type="button" data-value="3">腐&emsp;败</button>
        <button class="btn" type="button" data-value="4">大空洞</button>
        <button class="btn" type="button" data-value="5">隐&emsp;城</button>
      </div>
      <button class="fab-master-btn" type="button" id="fab-toggle-map" aria-label="展开地图选择">
        <span class="fab-master-text">地图</span>
        <span class="fab-master-icon">▲</span>
      </button>
    </div>

    <!-- 夜王按钮组 -->
    <div class="fab-group-wrapper fab-boss-group">
      <div class="fab-group js-toggle-group-boss collapsed" role="toolbar" aria-label="夜王选择">
        <button class="btn" type="button" data-value="0">三狼</button>
        <button class="btn" type="button" data-value="1">大嘴</button>
        <button class="btn" type="button" data-value="2">双虫</button>
        <button class="btn" type="button" data-value="3">水母</button>
        <button class="btn" type="button" data-value="4">癫羊</button>
        <button class="btn" type="button" data-value="5">人马</button>
        <button class="btn" type="button" data-value="6">冰龙</button>
        <button class="btn" type="button" data-value="7">黑夜王</button>
        <button class="btn" type="button" data-value="8">七仙女</button>
        <button class="btn" type="button" data-value="9">垃圾王</button>
      </div>
      <button class="fab-master-btn" type="button" id="fab-toggle-boss" aria-label="展开夜王选择">
        <span class="fab-master-text">夜王</span>
        <span class="fab-master-icon">▲</span>
      </button>
    </div>
  </div>

  <!-- Toast 提示框 -->
  <div id="toast" class="toast" role="alert"></div>

  <canvas class="game" id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script type="text/javascript" src="/nightreign/js/toggle.js"></script>
  <script type="text/javascript" src="/nightreign/js/bootstrap.js"></script>
  <script type="text/javascript" src="/nightreign/js/load_wasm.js"></script>
  
  <script>
    // 当 main() 被调用后，隐藏加载状态
    window.addEventListener('load', function() {
      // 监听 Module 的 onRuntimeInitialized 后再等一小段时间确保初始化完成
      var checkReady = setInterval(function() {
        if (Module && Module.calledRun) {
          setTimeout(function() {
            var loadingStatus = document.getElementById('loading-status');
            if (loadingStatus) {
              loadingStatus.classList.add('hidden');
            }
            console.log('[Loading] Loading complete, game started');
          }, 500);
          clearInterval(checkReady);
        }
      }, 100);
    });
  </script>
</body>

</html>
